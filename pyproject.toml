[project]
name = "troecarstvie-antibot-cv"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local bounded CV automation harness for controlled anti-bot research samples"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow and not transport'"
markers = [
  "unit: isolated unit test",
  "domain: domain-runtime or policy test",
  "integration: cross-module integration test",
  "transport: test that starts or exercises a transport boundary",
  "slow: comparatively expensive test; excluded from the fast command",
]
